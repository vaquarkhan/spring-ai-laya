name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Maven verify (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify
