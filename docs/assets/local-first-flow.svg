<g filter="url(#s)"><rect x="1190" y="127" width="331" height="166" rx="22" fill="#e1f8f3"/></g><circle cx="1239" cy="177" r="20" fill="#2fbf9b"/><path d="M1230 177l7 8 14-18" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/><text x="1273" y="178" fill="#0a6457" font-family="Arial,sans-serif" font-size="24" font-weight="700">Handle locally</text><text x="1230" y="219" fill="#315a65" font-family="Arial,sans-serif" font-size="17">Narrow choice set</text><text x="1230" y="246" fill="#315a65" font-family="Arial,sans-serif" font-size="17">Calibrated confidence clears policy</text>
<g filter="url(#s)"><rect x="1190" y="405" width="331" height="219" rx="22" fill="#fff5d9"/></g><circle cx="1239" cy="455" r="20" fill="#e2a500"/><path d="M1239 443v16m0 9v1" stroke="white" stroke-width="4" stroke-linecap="round"/><text x="1273" y="456" fill="#876000" font-family="Arial,sans-serif" font-size="24" font-weight="700">Escalate by policy</text><text x="1230" y="497" fill="#685a32" font-family="Arial,sans-serif" font-size="17">Many labels · below confidence floor</text><text x="1230" y="525" fill="#685a32" font-family="Arial,sans-serif" font-size="17">Laya abstention · local service unavailable</text><rect x="1230" y="552" width="245" height="42" rx="9" fill="#fff"/><text x="1352" y="579" text-anchor="middle" fill="#3155a6" font-family="Arial,sans-serif" font-size="17" font-weight="700">Jev or human review</text>
<text x="707" y="581" text-anchor="middle" fill="#526277" font-family="Arial,sans-serif" font-size="18">The application code retains the TypeSafeClient API.</text><text x="707" y="614" text-anchor="middle" fill="#526277" font-family="Arial,sans-serif" font-size="18">LayaTypeSafeClient and LayaEscalatingClient carry the routing logic.</text></svg>