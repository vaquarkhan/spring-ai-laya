<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Local-first Laya routing with Jev escalation</title><desc id="desc">An application sends a typed decision to Laya. A narrow high-confidence decision remains local. A wide label space, low confidence or Laya failure routes to Jev or human review based on policy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff9fa"/><stop offset="1" stop-color="#f6f8ff"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17334b" flood-opacity=".13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#61798b"/></marker></defs><rect width="1600" height="760" fill="url(#bg)"/>
<text x="800" y="71" text-anchor="middle" fill="#102a43" font-family="Arial,sans-serif" font-size="36" font-weight="700">Local-first is a policy you can explain.</text><text x="800" y="108" text-anchor="middle" fill="#526277" font-family="Arial,sans-serif" font-size="20">Use the decision shape, confidence and operational requirements to select the path.</text>
<g filter="url(#s)"><rect x="86" y="275" width="285" height="154" rx="21" fill="#102a43"/></g><text x="228" y="332" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="700">Spring AI application</text><text x="228" y="367" text-anchor="middle" fill="#c9dce4" font-family="Arial,sans-serif" font-size="18">typed choice · score · noul</text>
<path d="M385 352H526" fill="none" stroke="#61798b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#s)"><rect x="544" y="223" width="326" height="258" rx="22" fill="#087f8c"/></g><text x="707" y="283" text-anchor="middle" fill="#c9fffb" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">PRIMARY PATH</text><text x="707" y="330" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="35" font-weight="700">Laya</text><text x="707" y="365" text-anchor="middle" fill="#d8ffff" font-family="Arial,sans-serif" font-size="18">local System One decision</text><rect x="593" y="397" width="228" height="44" rx="10" fill="#076870"/><text x="707" y="425" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="17">answer_confidence + limits</text>
