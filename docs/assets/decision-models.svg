<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Laya and Jev deployment choices for spring-ai-typesafe</title><desc id="desc">A Spring AI application uses one TypeSafeClient API. Laya is self-hosted and local. Jev is a managed TypeSafe API. Both return typed System One decisions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e7f1f7"/></linearGradient><linearGradient id="laya" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e98a2"/><stop offset="1" stop-color="#08706f"/></linearGradient><linearGradient id="jev" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#496bc2"/><stop offset="1" stop-color="#29478f"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#17334b" flood-opacity=".13"/></filter><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path fill="#60788a" d="M0 0L11 5.5 0 11z"/></marker></defs>
<rect width="1600" height="760" fill="url(#bg)"/><text x="800" y="74" text-anchor="middle" fill="#102a43" font-family="Arial,sans-serif" font-size="36" font-weight="700">One Spring AI integration. Two deliberate deployment choices.</text><text x="800" y="111" text-anchor="middle" fill="#526277" font-family="Arial,sans-serif" font-size="20">The same typed System One questions and TypeSafeClient API connect both paths.</text>
<g filter="url(#s)"><rect x="500" y="164" width="600" height="152" rx="22" fill="#102a43"/><rect x="500" y="164" width="9" height="152" rx="4" fill="#18b7c8"/></g><text x="600" y="218" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="700">Spring AI application</text><text x="600" y="254" fill="#c8dce5" font-family="Arial,sans-serif" font-size="16">JevDocumentFilter · JevToolIndex · JevJudge · Advisors</text><rect x="600" y="273" width="196" height="27" rx="13" fill="#284f68"/><text x="698" y="293" text-anchor="middle" fill="#d7f6f5" font-family="Arial,sans-serif" font-size="16" font-weight="700">TypeSafeClient API</text>
<path d="M670 335 L410 426" fill="none" stroke="#60788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M930 335 L1190 426" fill="none" stroke="#60788a" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#s)"><rect x="96" y="438" width="620" height="230" rx="22" fill="url(#laya)"/></g><rect x="128" y="466" width="108" height="28" rx="14" fill="#b5f2ed"/><text x="182" y="486" text-anchor="middle" fill="#07585c" font-family="Arial,sans-serif" font-size="15" font-weight="700">SELF-HOSTED</text><text x="128" y="540" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="700">Laya</text><text x="128" y="575" fill="#d9ffff" font-family="Arial,sans-serif" font-size="19">Open-weight, local typed decisions</text><g fill="#e2ffff" font-family="Arial,sans-serif" font-size="18"><text x="128" y="620">• Keep data and inference in your environment</text><text x="128" y="650">• Fine-tune from your labelled decisions</text></g><rect x="518" y="549" width="160" height="72" rx="12" fill="#00616a"/><text x="598" y="579" text-anchor="middle" fill="#b5f2ed" font-family="Arial,sans-serif" font-size="15" font-weight="700">NATIVE FEATURES</text><text x="598" y="606" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16">batch · route · health</text>
<g filter="url(#s)"><rect x="884" y="438" width="620" height="230" rx="22" fill="url(#jev)"/></g><rect x="916" y="466" width="92" height="28" rx="14" fill="#dce4ff"/><text x="962" y="486" text-anchor="middle" fill="#29478f" font-family="Arial,sans-serif" font-size="15" font-weight="700">MANAGED</text><text x="916" y="540" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="700">Jev</text><text x="916" y="575" fill="#e6ecff" font-family="Arial,sans-serif" font-size="19">Hosted TypeSafe decision service</text><g fill="#e6ecff" font-family="Arial,sans-serif" font-size="18"><text x="916" y="620">• Managed model operations</text><text x="916" y="650">• Broad zero-shot decision coverage</text></g><rect x="1305" y="549" width="160" height="72" rx="12" fill="#213e86"/><text x="1385" y="579" text-anchor="middle" fill="#dce4ff" font-family="Arial,sans-serif" font-size="15" font-weight="700">USE WHEN</text><text x="1385" y="606" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16">managed path is right</text>
</svg>