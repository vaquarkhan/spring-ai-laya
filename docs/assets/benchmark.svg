<g filter="url(#sh)"><rect x="78" y="648" width="1444" height="154" rx="20" fill="#dff8f5"/></g><circle cx="130" cy="705" r="25" fill="#087f8c"/><path d="M118 705l8 9 17-21" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="697" fill="#103f48" font-family="Arial,sans-serif" font-size="25" font-weight="700">Use calibrated confidence where it carries signal.</text><text x="178" y="735" fill="#315a65" font-family="Arial,sans-serif" font-size="19">At an answer_confidence floor of 0.75, Laya served 80% of SST-2 at 95.6% accuracy and 87% of AG News at 97.1% accuracy.</text><text x="178" y="766" fill="#315a65" font-family="Arial,sans-serif" font-size="19">For Banking77, route by option count, shortlist first, fine-tune, or use a managed path. Confidence alone is not the right gate.</text>
</svg>