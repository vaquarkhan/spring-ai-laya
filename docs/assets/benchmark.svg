<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="t d"><title id="t">Measured Laya benchmark profile</title><desc id="d">Side-by-side accuracy and calibration charts for Laya on SST-2, AG News and Banking77. A box explains selective serving by confidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#075e69"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".2"/></filter></defs><rect width="1600" height="880" fill="url(#bg)"/>
<text x="80" y="80" fill="#b7eff0" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">LOCAL BENCHMARK · LAYA 0.4.19 · ENGLISH CHECKPOINT · ZERO-SHOT</text><text x="80" y="128" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="700">Strong signal in a bounded decision space.</text><text x="80" y="163" fill="#c7e5e9" font-family="Arial,sans-serif" font-size="20">Accuracy and calibration measured through the Spring AI TypeSafe adapter. CPU only, so this is a quality profile, not a latency claim.</text>
<g filter="url(#sh)"><rect x="78" y="180" width="710" height="428" rx="20" fill="#fff"/><rect x="812" y="180" width="710" height="428" rx="20" fill="#fff"/></g>
