<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Laya support implementation layers</title><desc id="d">Five layers: Spring AI applications, existing TypeSafe components, Laya adapter, native client, and laya-serve. Side fields show Laya-specific data returned to the application.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbfd"/><stop offset="1" stop-color="#e7f5f5"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#102a43" flood-opacity=".14"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#60788a"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="74" text-anchor="middle" fill="#102a43" font-family="Arial,sans-serif" font-size="38" font-weight="700">The integration adds Laya semantics without rewriting Spring AI components.</text><text x="800" y="111" text-anchor="middle" fill="#526277" font-family="Arial,sans-serif" font-size="20">New code stays in separate laya packages. Existing TypeSafe and Spring AI APIs remain stable.</text>
<g filter="url(#s)"><rect x="133" y="170" width="925" height="102" rx="18" fill="#102a43"/></g><text x="177" y="214" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="700">1. Your Spring AI application</text><text x="177" y="246" fill="#c6dde5" font-family="Arial,sans-serif" font-size="18">RAG pipeline · agent tool selection · guardrails · evaluation</text>
<path d="M595 286v42" stroke="#60788a" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="133" y="344" width="925" height="114" rx="18" fill="#3155a6"/></g><text x="177" y="387" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="700">2. Existing spring-ai-typesafe components</text><text x="177" y="420" fill="#e3e9ff" font-family="Arial,sans-serif" font-size="18">RAG filter · reranker · tool index · judge · advisors</text><rect x="789" y="372" width="228" height="52" rx="11" fill="#213e86"/><text x="903" y="404" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="17" font-weight="700">TypeSafeClient contract</text>
<path d="M595 472v42" stroke="#60788a" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="133" y="530" width="925" height="130" rx="18" fill="#087f8c"/></g><text x="177" y="573" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="700">3. LayaTypeSafeClient and LayaEscalatingClient</text><text x="177" y="605" fill="#dffffc" font-family="Arial,sans-serif" font-size="18">Preserve Jev-compatible confidence · native batch routing · Laya-first, Jev-on-policy escalation</text><text x="177" y="633" fill="#b9f2ed" font-family="Arial,sans-serif" font-size="16">io.github.vaquarkhan.springailaya</text>
<path d="M595 674v42" stroke="#60788a" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="133" y="732" width="925" height="102" rx="18" fill="#0b6570"/></g><text x="177" y="775" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="700">4. LayaClient</text><text x="177" y="807" fill="#dffffc" font-family="Arial,sans-serif" font-size="18">/v1/systemone · /v1/systemone/batch · /v1/route · /health</text>
<path d="M1074 783h98" stroke="#60788a" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="1190" y="732" width="290" height="102" rx="18" fill="#06454f"/></g><text x="1335" y="777" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="700">laya-serve</text><text x="1335" y="808" text-anchor="middle" fill="#bdf3ef" font-family="Arial,sans-serif" font-size="17">self-hosted inference</text>
<g filter="url(#s)"><rect x="1110" y="170" width="370" height="490" rx="20" fill="white"/></g><text x="1151" y="218" fill="#102a43" font-family="Arial,sans-serif" font-size="23" font-weight="700">Laya-native signals</text><text x="1151" y="254" fill="#526277" font-family="Arial,sans-serif" font-size="17">Available without changing the</text><text x="1151" y="279" fill="#526277" font-family="Arial,sans-serif" font-size="17">existing component interfaces.</text><g font-family="Arial,sans-serif" font-size="18"><circle cx="1158" cy="331" r="7" fill="#087f8c"/><text x="1180" y="337" fill="#263e50">answer_confidence</text><circle cx="1158" cy="384" r="7" fill="#087f8c"/><text x="1180" y="390" fill="#263e50">abstention state and threshold</text><circle cx="1158" cy="437" r="7" fill="#087f8c"/><text x="1180" y="443" fill="#263e50">routing model and reason</text><circle cx="1158" cy="490" r="7" fill="#087f8c"/><text x="1180" y="496" fill="#263e50">state truncation and usage</text><circle cx="1158" cy="543" r="7" fill="#087f8c"/><text x="1180" y="549" fill="#263e50">server health and timing</text><circle cx="1158" cy="596" r="7" fill="#087f8c"/><text x="1180" y="602" fill="#263e50">413 and 503 typed errors</text></g></svg>