<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">Strict Laya Jev benchmark parity receipt</title><desc id="d">The same ordered labelled data and exact question payload travel to Laya and Jev. Each result is evaluated by the same evaluator. SHA-256 receipts prove the inputs match and the comparison rejects partial results.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#075e69"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#001c2b" flood-opacity=".28"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#b8dae1"/></marker></defs><rect width="1600" height="820" fill="url(#bg)"/><text x="800" y="74" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="700">A comparison receipt makes side-by-side claims reviewable.</text><text x="800" y="110" text-anchor="middle" fill="#c5e8eb" font-family="Arial,sans-serif" font-size="20">The benchmark varies only backend-specific model and transport details, not the decision task.</text>
<g filter="url(#s)"><rect x="103" y="184" width="530" height="223" rx="22" fill="#f8ffff"/></g><text x="145" y="230" fill="#102a43" font-family="Arial,sans-serif" font-size="25" font-weight="700">Fixed decision task</text><g fill="#365064" font-family="Arial,sans-serif" font-size="18"><text x="145" y="272">Ordered labelled input states</text><text x="145" y="307">Question id · type · instructions</text><text x="145" y="342">Option labels · descriptions · order</text><text x="145" y="377">Exact-match accuracy · 10-bin ECE</text></g><rect x="145" y="389" width="430" height="1" fill="#d9e6e9"/>
<path d="M653 255h192" stroke="#b8dae1" stroke-width="4" marker-end="url(#a)"/><path d="M653 353h192" stroke="#b8dae1" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="866" y="169" width="305" height="168" rx="20" fill="#07818b"/></g><text x="1018" y="224" text-anchor="middle" fill="#cffefa" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">LOCAL BACKEND</text><text x="1018" y="271" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="700">Laya</text><text x="1018" y="304" text-anchor="middle" fill="#dffffc" font-family="Arial,sans-serif" font-size="17">english checkpoint</text>
<g filter="url(#s)"><rect x="866" y="369" width="305" height="168" rx="20" fill="#3155a6"/></g><text x="1018" y="424" text-anchor="middle" fill="#e3e9ff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">MANAGED BACKEND</text><text x="1018" y="471" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="700">Jev</text><text x="1018" y="504" text-anchor="middle" fill="#e3e9ff" font-family="Arial,sans-serif" font-size="17">jev-latest</text>
<path d="M1187 252h128" stroke="#b8dae1" stroke-width="4" marker-end="url(#a)"/><path d="M1187 454h128" stroke="#b8dae1" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="1335" y="244" width="184" height="218" rx="20" fill="#f4fbfc"/></g><text x="1427" y="292" text-anchor="middle" fill="#102a43" font-family="Arial,sans-serif" font-size="22" font-weight="700">Same evaluator</text><text x="1427" y="334" text-anchor="middle" fill="#365064" font-family="Arial,sans-serif" font-size="17">accuracy</text><text x="1427" y="363" text-anchor="middle" fill="#365064" font-family="Arial,sans-serif" font-size="17">calibration</text><text x="1427" y="392" text-anchor="middle" fill="#365064" font-family="Arial,sans-serif" font-size="17">coverage</text><rect x="1360" y="412" width="135" height="30" rx="15" fill="#daf4f0"/><text x="1427" y="433" text-anchor="middle" fill="#096757" font-family="Arial,sans-serif" font-size="14" font-weight="700">NO PARTIAL RUNS</text>
<g filter="url(#s)"><rect x="103" y="582" width="1416" height="155" rx="22" fill="#dff8f5"/></g><text x="148" y="633" fill="#0b6d70" font-family="Arial,sans-serif" font-size="24" font-weight="700">What every parity receipt records</text><g fill="#315a65" font-family="Arial,sans-serif" font-size="19"><text x="148" y="676">SHA-256(state + expected label order)</text><text x="603" y="676">SHA-256(exact question payload)</text><text x="1045" y="676">configured model IDs and transport</text><text x="148" y="710">expected input count; a missing response fails the complete comparison</text></g></svg>